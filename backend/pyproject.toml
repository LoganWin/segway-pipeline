[project]
name = "segway-backend"
version = "0.1.0"
description = "segway-pipeline API: profile, jobs, matching, resumes, ATS fill."
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic",
    "fastapi",
    "pydantic-settings",
    "sqlmodel",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx2",
    "pyright",
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
include = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
